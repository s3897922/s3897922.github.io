<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment 3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Space+Grotesk&display=swap"
      rel="stylesheet"
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <!-- use of playful/handwritten-style fonts such as concert one, reflects the goal of engaging users with a creative journaling experience. design decision ensures the interface feels welcoming/casual which aligns with  the playful drag-and-drop interaction -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Concert+One&family=VT323&display=swap"
      rel="stylesheet"
    />
    />
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="content-wrapper">
      <div class="theme">
        <label for="theme-input" class="theme-label">THEME:</label>
        <input type="text" id="theme-input" placeholder="Type in the theme.." />
        <!-- input field to encourage personalisation, allowing users to engage and creatively choose their own theme based on the images they see -->
      </div>

      <div class="journal-container">
        <img src="journal.png" alt="Journal Page" class="journal-background" />
      </div>
    </div>

    <!-- journal/stickers were all hand drawn by myself using procreate, and polaroid images are personal images edited using meitu -->
    <!-- decision to use hand drawn elements as stickers and the journal design reflects a real-life personalisation of a journal, giving the overall interface a ‘scrapbook’ look to it -->
    <!-- the page design avoids scroll bars to keep the  entire experience visually contained, this helps to maintain it by  mimicking a physical journal/scrapbook -->
    <div class="decorations">
      <img
        src="polaroid1.jpg"
        class="polaroid"
        draggable="true"
        id="polaroid1"
      />

      <img
        src="polaroid2.jpg"
        class="polaroid"
        draggable="true"
        id="polaroid2"
      />

      <img
        src="polaroid3.jpg"
        class="polaroid"
        draggable="true"
        id="polaroid3"
      />

      <img
        src="polaroid4.jpg"
        class="polaroid"
        draggable="true"
        id="polaroid4"
      />

      <img src="heart.PNG" class="sticker" draggable="true" id="sticker1" />

      <img src="bow.PNG" class="sticker" draggable="true" id="sticker2" />

      <img src="recap.PNG" class="sticker" draggable="true" id="sticker3" />

      <img src="tulip.PNG" class="sticker" draggable="true" id="sticker4" />

      <img src="stars.PNG" class="sticker" draggable="true" id="sticker5" />

      <img src="cherry.PNG" class="sticker" draggable="true" id="sticker6" />

      <img src="star.PNG" class="sticker" draggable="true" id="sticker7" />

      <img src="hearts.PNG" class="sticker" draggable="true" id="sticker8" />

      <img src="moon.PNG" class="sticker" draggable="true" id="sticker9" />
    </div>

    <!-- by using these elements and making them draggable, users are given a sense of freedom to choose their own layout designs. this encourages engagement where rather than having a static webpage it offers users a creative and interactive experience -->

    <div class="decorations2">
      <img
        src="polaroid5.jpg"
        class="polaroid"
        draggable="true"
        id="polaroid5"
      />

      <img
        src="polaroid6.jpg"
        class="polaroid"
        draggable="true"
        id="polaroid6"
      />

      <img
        src="polaroid7.jpg"
        class="polaroid"
        draggable="true"
        id="polaroid7"
      />

      <img
        src="polaroid8.jpg"
        class="polaroid"
        draggable="true"
        id="polaroid8"
      />
    </div>
  </body>
</html>
